<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYON CELL BD - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #111827; color: #fff; min-height: 100vh; padding: 20px; }
        .sidebar-brand { font-size: 1.4rem; font-weight: 800; color: #ffc107; border-bottom: 1px solid #374151; padding-bottom: 15px; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); background: #fff; margin-bottom: 25px; }
        .btn-gold { background: #ffc107; font-weight: bold; color: #000; border: none; border-radius: 10px; padding: 12px; }
        .btn-gold:hover { background: #e0a800; }
        .section-header { border-left: 4px solid #ffc107; padding-left: 10px; font-weight: 700; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="sidebar-brand mb-4">
                <i class="fa-solid fa-sliders text-warning me-2"></i>SAYON MASTER
            </div>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link active bg-warning text-dark fw-bold"><i class="fa-solid fa-gears me-2"></i>অল ইন ওয়ান কন্ট্রোল</a>
                </li>
            </ul>
        </div>
        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">অ্যাডমিন কন্ট্রোল প্যানেল</h3>
                <span class="badge bg-warning text-dark px-3 py-2 fs-6 fw-bold"><i class="fa-solid fa-lock-open me-1"></i> ফুল কন্ট্রোল মোড</span>
            </div>

            <!-- ওয়েবসাইট ও অপারেটর স্ট্যাটাস কন্ট্রোল -->
            <div class="row">
                <div class="col-12">
                    <div class="card card-custom p-4 border-warning border-2">
                        <h5 class="section-header text-danger"><i class="fa-solid fa-power-off text-danger me-2"></i>ওয়েবসাইট ও অপারেটর স্ট্যাটাস</h5>
                        <div class="row align-items-center mb-3">
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label class="form-label fw-bold">ওয়েবসাইট অবস্থা সিলেক্ট করুন:</label>
                                <select id="cfg-site-status" class="form-select border-warning fw-bold">
                                    <option value="open">🟢 ওয়েবসাইট চালু রাখুন (Open)</option>
                                    <option value="closed">🔴 ওয়েবসাইট বন্ধ রাখুন (Closed)</option>
                                </select>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-bold">ওয়েবসাইট বন্ধ থাকলে দেখানোর নোটিশ:</label>
                                <input type="text" id="cfg-site-close-msg" class="form-control">
                            </div>
                        </div>

                        <hr>
                        <h6 class="fw-bold mb-3"><i class="fa-solid fa-toggle-on text-warning me-2"></i>আলাদা আলাদা অপারেটর চালু / বন্ধ রাখুন:</h6>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Robi Status:</label>
                                <select id="status-Robi" class="form-select border-primary fw-bold">
                                    <option value="active">🟢 চালু</option>
                                    <option value="inactive">🔴 বন্ধ</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Airtel Status:</label>
                                <select id="status-Airtel" class="form-select border-danger fw-bold">
                                    <option value="active">🟢 চালু</option>
                                    <option value="inactive">🔴 বন্ধ</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Banglalink Status:</label>
                                <select id="status-Banglalink" class="form-select border-warning fw-bold">
                                    <option value="active">🟢 চালু</option>
                                    <option value="inactive">🔴 বন্ধ</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold">Grameenphone Status:</label>
                                <select id="status-GP" class="form-select border-info fw-bold">
                                    <option value="active">🟢 চালু</option>
                                    <option value="inactive">🔴 বন্ধ</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-12 mt-4">
                            <button class="btn btn-gold w-100" onclick="saveSiteStatus()"><i class="fa-solid fa-floppy-disk me-2"></i>স্ট্যাটাস সেটিংস সেভ করুন</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ব্র্যান্ডিং ও হোয়াটসঅ্যাপ সেটিংস -->
            <div class="row">
                <div class="col-lg-6">
                    <div class="card card-custom p-4">
                        <h5 class="section-header"><i class="fa-solid fa-globe text-warning me-2"></i>ব্র্যান্ডিং সেটিং</h5>
                        <div class="mb-3"><label class="form-label fw-bold">ব্র্যান্ডের নাম:</label><input type="text" id="cfg-site-name" class="form-control"></div>
                        <div class="mb-3"><label class="form-label fw-bold">সাপোর্ট টেক্সট:</label><input type="text" id="cfg-support-text" class="form-control"></div>
                        <div class="mb-3"><label class="form-label fw-bold">ব্যানার হেডিং:</label><input type="text" id="cfg-hero-title" class="form-control"></div>
                        <div class="mb-3"><label class="form-label fw-bold">ব্যানার বিবরণ:</label><input type="text" id="cfg-hero-sub" class="form-control"></div>
                        <div class="mb-3"><label class="form-label fw-bold">লাইভ নোটিশ বার টেক্সট:</label><textarea id="cfg-notice-text" class="form-control" rows="2"></textarea></div>
                        <button class="btn btn-gold w-100" onclick="saveBrandingSettings()"><i class="fa-solid fa-floppy-disk me-2"></i>ব্র্যান্ডিং তথ্য সেভ করুন</button>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card card-custom p-4">
                        <h5 class="section-header"><i class="fa-solid fa-paper-plane text-warning me-2"></i>মেসেজ সেটিংস</h5>
                        <div class="mb-3"><label class="form-label fw-bold">অর্ডার বাটন টেক্সট:</label><input type="text" id="cfg-btn-text" class="form-control border-warning fw-bold"></div>
                        <div class="mb-3"><label class="form-label fw-bold">হোয়াটসঅ্যাপ নম্বর:</label><input type="text" id="cfg-wa-num" class="form-control"></div>
                        <div class="mb-3"><label class="form-label fw-bold">মেসেজ ফরম্যাট:</label><textarea id="cfg-wa-msg-template" class="form-control" rows="5"></textarea></div>
                        <button class="btn btn-gold w-100" onclick="saveWASettings()"><i class="fa-solid fa-floppy-disk me-2"></i>অর্ডার সেটিংস সেভ করুন</button>
                    </div>
                </div>
            </div>

            <!-- অফার এন্ট্রি -->
            <div class="row">
                <div class="col-12">
                    <div class="card card-custom p-4">
                        <h5 class="section-header"><i class="fa-solid fa-list-check text-warning me-2"></i>অফারের তালিকা যুক্ত করুন</h5>
                        <div class="mb-3">
                            <label class="form-label fw-bold fs-5 text-primary">১. অপারেটর সিলেক্ট করুন:</label>
                            <select id="selected-operator" class="form-select form-select-lg border-warning fw-bold">
                                <option value="Robi" selected>রবি (Robi)</option>
                                <option value="Airtel">এয়ারটেল (Airtel)</option>
                                <option value="Banglalink">বাংলালিংক (Banglalink)</option>
                                <option value="GP">গ্রামীণফোন (Grameenphone)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">২. অফারের তালিকা পেস্ট করুন:</label>
                            <textarea id="ai-text-input" class="form-control" rows="6"></textarea>
                        </div>
                        <button class="btn btn-gold w-100 fs-5" onclick="processSelectedOperatorOffers()">
                            <i class="fa-solid fa-plus-circle me-2"></i>সিলেক্ট করা অপারেটরে অফার যুক্ত করুন
                        </button>
                    </div>
                </div>
            </div>

            <!-- লাইভ অফার টেবিল এবং ডিলিট কন্ট্রোল -->
            <div class="card card-custom p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                    <h5 class="section-header mb-0"><i class="fa-solid fa-database text-warning me-2"></i>লাইভ অফারের তালিকা</h5>
                    
                    <div class="flex-grow-1 mx-md-3" style="max-width: 300px;">
                        <input type="text" id="search-input" class="form-control border-warning" placeholder="অফার বা অপারেটর খুঁজুন..." onkeyup="renderAdminTable()">
                    </div>

                    <!-- নির্দিষ্ট অপারেটরের সব মুছে ফেলার অপশন -->
                    <div class="d-flex gap-2 align-items-center">
                        <select id="delete-op-select" class="form-select border-danger fw-bold" style="width: auto;">
                            <option value="Robi">Robi</option>
                            <option value="Airtel">Airtel</option>
                            <option value="Banglalink">Banglalink</option>
                            <option value="GP">GP</option>
                        </select>
                        <button class="btn btn-danger btn-sm fw-bold" onclick="deleteOperatorOffers()"><i class="fa-solid fa-trash me-1"></i>এর সব অফার মুছুন</button>
                        <button class="btn btn-outline-danger btn-sm fw-bold" onclick="clearAllOffers()"><i class="fa-solid fa-skull me-1"></i>সব অফার মুছুন</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-dark">
                            <tr>
                                <th>অপারেটর</th>
                                <th>প্যাকেজ ডিটেইলস</th>
                                <th>মেয়াদ</th>
                                <th>মূল্য (৳)</th>
                                <th>অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- এডিট অফার মোডাল -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square me-2"></i>অফার এডিট করুন</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                <div class="mb-3">
                    <label class="form-label fw-bold">অপারেটর:</label>
                    <select id="edit-op" class="form-select border-warning">
                        <option value="Robi">Robi</option>
                        <option value="Airtel">Airtel</option>
                        <option value="Banglalink">Banglalink</option>
                        <option value="GP">GP</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">প্যাকেজ ডিটেইলস:</label>
                    <input type="text" id="edit-title" class="form-control border-warning">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">মেয়াদ:</label>
                    <input type="text" id="edit-validity" class="form-control border-warning">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">মূল্য (৳):</label>
                    <input type="number" id="edit-price" class="form-control border-warning">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বাতিল</button>
                <button type="button" class="btn btn-warning fw-bold" onclick="saveEditedOffer()">সেভ করুন</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase Modular SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAMQUxUqwLQaR6aAxCvwOHGH_n0ZuUZp4s",
    authDomain: "sayon-cell-bd.firebaseapp.com",
    databaseURL: "https://sayon-cell-bd-default-rtdb.firebaseio.com",
    projectId: "sayon-cell-bd",
    storageBucket: "sayon-cell-bd.firebasestorage.app",
    messagingSenderId: "986946019076",
    appId: "1:986946019076:web:ac1989df1fa51da61d3a51"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentOffers = [];
  let editModalObj = null;

  function bnToEnDigits(str) {
      const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      return str.replace(/[০-৯]/g, d => bnDigits.indexOf(d));
  }

  function loadConfig() {
      get(ref(db, 'config')).then((snapshot) => {
          if (snapshot.exists()) {
              const data = snapshot.val();
              document.getElementById('cfg-site-status').value = data.site_status || "open";
              document.getElementById('cfg-site-close-msg').value = data.site_close_msg || "দুঃখিত! সার্ভিস সাময়িকভাবে বন্ধ আছে।";
              
              document.getElementById('status-Robi').value = data.op_Robi || "active";
              document.getElementById('status-Airtel').value = data.op_Airtel || "active";
              document.getElementById('status-Banglalink').value = data.op_Banglalink || "active";
              document.getElementById('status-GP').value = data.op_GP || "active";

              document.getElementById('cfg-site-name').value = data.site_name || "SAYON CELL BD";
              document.getElementById('cfg-support-text').value = data.support_text || "২৪/৭ লাইভ সাপোর্ট";
              document.getElementById('cfg-hero-title').value = data.hero_title || "সেরা অফার বেছে নিন নিমিষেই ⚡";
              document.getElementById('cfg-hero-sub').value = data.hero_sub || "আপনার নম্বর দিন এবং সরাসরি রিচার্জ করুন";
              document.getElementById('cfg-notice-text').value = data.notice_text || "আজকের স্পেশাল ধামাকা অফার!";
              document.getElementById('cfg-btn-text').value = data.btn_text || "অর্ডার নিশ্চিত করুন";
              document.getElementById('cfg-wa-num').value = data.wa_num || "8801872900153";
              document.getElementById('cfg-wa-msg-template').value = data.wa_msg_template || `السلام عليكم!\nআমি ওয়েবসাইট থেকে অফার অর্ডার করতে চাই:\n\n👤 *গ্রাহকের নাম:* {name}\n📱 *অপারেটর:* {operator}\n📦 *অফার:* {offer}\n💵 *মূল্য:* ৳{price}\n📲 *রিচার্জের নম্বর:* {phone}`;
          }
      });
  }

  onValue(ref(db, 'offers'), (snapshot) => {
      const data = snapshot.val();
      currentOffers = [];
      if (data) {
          Object.keys(data).forEach(key => {
              currentOffers.push({ firebaseId: key, ...data[key] });
          });
      }
      renderAdminTable();
  });

  window.saveSiteStatus = function() {
      update(ref(db, 'config'), {
          site_status: document.getElementById('cfg-site-status').value,
          site_close_msg: document.getElementById('cfg-site-close-msg').value,
          op_Robi: document.getElementById('status-Robi').value,
          op_Airtel: document.getElementById('status-Airtel').value,
          op_Banglalink: document.getElementById('status-Banglalink').value,
          op_GP: document.getElementById('status-GP').value
      }).then(() => alert('স্ট্যাটাস সেটিংস সেভ হয়েছে!'));
  };

  window.saveBrandingSettings = function() {
      update(ref(db, 'config'), {
          site_name: document.getElementById('cfg-site-name').value,
          support_text: document.getElementById('cfg-support-text').value,
          hero_title: document.getElementById('cfg-hero-title').value,
          hero_sub: document.getElementById('cfg-hero-sub').value,
          notice_text: document.getElementById('cfg-notice-text').value
      }).then(() => alert('ব্র্যান্ডিং তথ্য সেভ হয়েছে!'));
  };

  window.saveWASettings = function() {
      update(ref(db, 'config'), {
          btn_text: document.getElementById('cfg-btn-text').value,
          wa_num: document.getElementById('cfg-wa-num').value,
          wa_msg_template: document.getElementById('cfg-wa-msg-template').value
      }).then(() => alert('অর্ডার সেটিংস সেভ হয়েছে!'));
  };

  window.processSelectedOperatorOffers = function() {
      let text = document.getElementById('ai-text-input').value;
      let selectedOperator = document.getElementById('selected-operator').value;
      if(!text.trim()) return alert('অনুগ্রহ করে অফারের টেক্সট পেস্ট করুন!');

      let lines = text.split('\n');
      let badgeBg = "bg-danger text-white"; 
      if(selectedOperator === "Banglalink") badgeBg = "bg-warning text-dark";
      if(selectedOperator === "GP") badgeBg = "bg-info text-dark";

      let promises = [];
      lines.forEach(line => {
          let trimmed = line.trim();
          if(!trimmed) return;

          let convertedLine = bnToEnDigits(trimmed);
          let priceMatch = convertedLine.match(/(\d+)\s*(টাকা|tk|bdt)/i) || convertedLine.match(/—\s*(\d+)/);
          if(!priceMatch) return;

          let price = priceMatch[1];
          let daysMatch = convertedLine.match(/(\d+)\s*(দিন|days)/i) || ["", "৩০ দিন"];
          let validity = daysMatch[0];

          let cleanDetails = trimmed
              .replace(/^\d+[\.\)]\s*/, '')
              .replace(/—\s*[০-৯\d]+\s*টাকা.*/i, '')
              .replace(/—\s*[০-৯\d]+\s*(দিন|days).*/i, '')
              .trim();

          let newOfferRef = ref(db, 'offers/' + Date.now() + "_" + Math.floor(Math.random() * 100
