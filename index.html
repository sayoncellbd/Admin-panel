<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAYON CELL BD - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #111827; color: #fff; min-height: 100vh; padding: 20px; }
        .sidebar-brand { font-size: 1.4rem; font-weight: 800; color: #ffc107; border-bottom: 1px solid #374151; padding-bottom: 15px; }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); background: #fff; margin-bottom: 25px; }
        .btn-gold { background: #ffc107; font-weight: bold; color: #000; border: none; border-radius: 10px; padding: 12px; }
        .btn-gold:hover { background: #e0a800; }
        .section-header { border-left: 4px solid #ffc107; padding-left: 10px; font-weight: 700; margin-bottom: 20px; }
        .table-inactive { background-color: #f8d7da !important; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar d-none d-md-block">
            <div class="sidebar-brand mb-4">
                <i class="fa-solid fa-sliders text-warning me-2"></i>SAYON MASTER
            </div>
            <ul class="nav nav-pills flex-column">
                <li class="nav-item mb-2">
                    <a href="#" class="nav-link active bg-warning text-dark fw-bold"><i class="fa-solid fa-gears me-2"></i>কন্ট্রোল প্যানেল</a>
                </li>
            </ul>
        </div>

        <div class="col-md-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">অ্যাডমিন কন্ট্রোল প্যানেল (Firebase Live)</h3>
                <span class="badge bg-warning text-dark px-3 py-2 fs-6 fw-bold"><i class="fa-solid fa-signal me-1"></i> লাইভ সার্ভার কানেক্টেড</span>
            </div>

            <!-- ওয়েবসাইট বন্ধ/চালু করার সেকশন -->
            <div class="card card-custom p-4 border-warning border-2">
                <h5 class="section-header text-danger"><i class="fa-solid fa-power-off me-2"></i>ওয়েবসাইট স্ট্যাটাস</h5>
                <div class="row align-items-center">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">ওয়েবসাইট অবস্থা:</label>
                        <select id="cfg-site-status" class="form-select border-warning fw-bold">
                            <option value="open">🟢 ওয়েবসাইট চালু (Open)</option>
                            <option value="closed">🔴 ওয়েবসাইট বন্ধ (Maintenance)</option>
                        </select>
                    </div>
                    <div class="col-md-8 mb-3">
                        <label class="form-label fw-bold">বন্ধের সময় দেখানোর নোটিশ:</label>
                        <input type="text" id="cfg-site-close-msg" class="form-control">
                    </div>
                    <div class="col-12">
                        <button class="btn btn-gold w-100" onclick="saveSiteStatus()"><i class="fa-solid fa-floppy-disk me-2"></i>স্ট্যাটাস সেভ করুন</button>
                    </div>
                </div>
            </div>

            <!-- ব্র্যান্ডিং ও সেটিংস -->
            <div class="row">
                <div class="col-lg-6">
                    <div class="card card-custom p-4">
                        <h5 class="section-header"><i class="fa-solid fa-globe me-2"></i>ব্র্যান্ডিং ও টেক্সট সেটিং</h5>
                        <div class="mb-3"><label class="fw-bold">ব্র্যান্ডের নাম:</label><input type="text" id="cfg-site-name" class="form-control"></div>
                        <div class="mb-3"><label class="fw-bold">সাপোর্ট টেক্সট:</label><input type="text" id="cfg-support-text" class="form-control"></div>
                        <div class="mb-3"><label class="fw-bold">ব্যানার হেডিং:</label><input type="text" id="cfg-hero-title" class="form-control"></div>
                        <div class="mb-3"><label class="fw-bold">ব্যানার বিবরণ:</label><input type="text" id="cfg-hero-sub" class="form-control"></div>
                        <div class="mb-3"><label class="fw-bold">লাইভ নোটিশ বার:</label><textarea id="cfg-notice-text" class="form-control" rows="2"></textarea></div>
                        <button class="btn btn-gold w-100" onclick="saveBrandingSettings()"><i class="fa-solid fa-floppy-disk me-2"></i>ব্র্যান্ডিং সেভ করুন</button>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card card-custom p-4">
                        <h5 class="section-header"><i class="fa-solid fa-paper-plane me-2"></i>অর্ডার ও মেসেজ সেটিংস</h5>
                        <div class="mb-3"><label class="fw-bold">অর্ডার বাটন টেক্সট:</label><input type="text" id="cfg-btn-text" class="form-control"></div>
                        <div class="mb-3"><label class="fw-bold">হোয়াটসঅ্যাপ নম্বর:</label><input type="text" id="cfg-wa-num" class="form-control"></div>
                        <div class="mb-3"><label class="fw-bold">মেসেজ ফরম্যাট:</label><textarea id="cfg-wa-msg-template" class="form-control" rows="5"></textarea></div>
                        <button class="btn btn-gold w-100" onclick="saveWASettings()"><i class="fa-solid fa-floppy-disk me-2"></i>অর্ডার সেটিংস সেভ করুন</button>
                    </div>
                </div>
            </div>

            <!-- অফার এন্ট্রি -->
            <div class="card card-custom p-4">
                <h5 class="section-header"><i class="fa-solid fa-plus-circle me-2"></i>নতুন অফার এন্ট্রি</h5>
                <div class="mb-3">
                    <label class="fw-bold">অপারেটর সিলেক্ট করুন:</label>
                    <select id="selected-operator" class="form-select border-warning fw-bold">
                        <option value="Robi">রবি (Robi)</option>
                        <option value="Airtel">এয়ারটেল (Airtel)</option>
                        <option value="Banglalink">বাংলালিংক (Banglalink)</option>
                        <option value="GP">গ্রামীণফোন (GP)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="fw-bold">অফারের তালিকা পেস্ট করুন:</label>
                    <textarea id="ai-text-input" class="form-control" rows="5" placeholder="যেমন: 50 GB (30 Days) — 599 টাকা"></textarea>
                </div>
                <button class="btn btn-gold w-100" onclick="processSelectedOperatorOffers()"><i class="fa-solid fa-cloud-arrow-up me-2"></i>সার্ভারে অফার যুক্ত করুন</button>
            </div>

            <!-- লাইভ অফার ম্যানেজমেন্ট -->
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="section-header mb-0"><i class="fa-solid fa-database me-2"></i>লাইভ অফারের তালিকা</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-warning text-dark fw-bold" onclick="toggleOperatorStatus(false)">ফিল্টার করা অফার বন্ধ</button>
                        <button class="btn btn-sm btn-outline-success fw-bold" onclick="toggleOperatorStatus(true)">ফিল্টার করা অফার চালু</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="clearFilteredOrAllOffers()">অফার মুছুন</button>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-7"><input type="text" id="search-input" class="form-control" placeholder="সার্চ করুন..." onkeyup="renderAdminTable()"></div>
                    <div class="col-md-5">
                        <select id="filter-operator" class="form-select fw-bold" onchange="renderAdminTable()">
                            <option value="ALL">সব অপারেটর</option>
                            <option value="Robi">Robi</option>
                            <option value="Airtel">Airtel</option>
                            <option value="Banglalink">Banglalink</option>
                            <option value="GP">GP</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle border">
                        <thead class="table-dark">
                            <tr>
                                <th>অপারেটর</th>
                                <th>ডিটেইলস</th>
                                <th>মেয়াদ</th>
                                <th>মূল্য</th>
                                <th>স্ট্যাটাস</th>
                                <th class="text-center">অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- এডিট মোডাল -->
<div class="modal fade" id="editOfferModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3">
      <h5 class="fw-bold mb-3">অফার এডিট করুন</h5>
      <input type="hidden" id="edit-offer-id">
      <div class="mb-2"><label class="fw-bold">অপারেটর:</label><select id="edit-offer-op" class="form-select"><option value="Robi">Robi</option><option value="Airtel">Airtel</option><option value="Banglalink">Banglalink</option><option value="GP">GP</option></select></div>
      <div class="mb-2"><label class="fw-bold">ডিটেইলস:</label><input type="text" id="edit-offer-title" class="form-control"></div>
      <div class="mb-2"><label class="fw-bold">মেয়াদ:</label><input type="text" id="edit-offer-validity" class="form-control"></div>
      <div class="mb-3"><label class="fw-bold">মূল্য (৳):</label><input type="number" id="edit-offer-price" class="form-control"></div>
      <button class="btn btn-gold w-100" onclick="saveEditedOffer()">সেভ করুন</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // ⚠️ আপনার Firebase কনফিগারেশন বসান
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let editModal;
    let localOffersList = [];

    function bnToEnDigits(str) {
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return str.replace(/[০-৯]/g, d => bnDigits.indexOf(d));
    }

    // লাইভ ডাটা লোড
    db.ref().on('value', (snapshot) => {
        const data = snapshot.val() || {};
        
        if(data.settings) {
            document.getElementById('cfg-site-status').value = data.settings.status || "open";
            document.getElementById('cfg-site-close-msg').value = data.settings.closeMsg || "";
            document.getElementById('cfg-site-name').value = data.settings.siteName || "SAYON CELL BD";
            document.getElementById('cfg-support-text').value = data.settings.supportText || "";
            document.getElementById('cfg-hero-title').value = data.settings.heroTitle || "";
            document.getElementById('cfg-hero-sub').value = data.settings.heroSub || "";
            document.getElementById('cfg-notice-text').value = data.settings.noticeText || "";
            document.getElementById('cfg-btn-text').value = data.settings.btnText || "";
            document.getElementById('cfg-wa-num').value = data.settings.waNum || "8801872900153";
            document.getElementById('cfg-wa-msg-template').value = data.settings.waTemplate || "";
        }

        localOffersList = [];
        if(data.offers) {
            Object.keys(data.offers).forEach(key => {
                localOffersList.push({ id: key, ...data.offers[key] });
            });
        }
        renderAdminTable();
    });

    function saveSiteStatus() {
        db.ref('settings').update({
            status: document.getElementById('cfg-site-status').value,
            closeMsg: document.getElementById('cfg-site-close-msg').value
        }).then(() => alert('স্ট্যাটাস লাইভ সেভ হয়েছে!'));
    }

    function saveBrandingSettings() {
        db.ref('settings').update({
            siteName: document.getElementById('cfg-site-name').value,
            supportText: document.getElementById('cfg-support-text').value,
            heroTitle: document.getElementById('cfg-hero-title').value,
            heroSub: document.getElementById('cfg-hero-sub').value,
            noticeText: document.getElementById('cfg-notice-text').value
        }).then(() => alert('ব্র্যান্ডিং লাইভ সেভ হয়েছে!'));
    }

    function saveWASettings() {
        db.ref('settings').update({
            btnText: document.getElementById('cfg-btn-text').value,
            waNum: document.getElementById('cfg-wa-num').value,
            waTemplate: document.getElementById('cfg-wa-msg-template').value
        }).then(() => alert('অর্ডার সেটিংস লাইভ সেভ হয়েছে!'));
    }

    function processSelectedOperatorOffers() {
        let text = document.getElementById('ai-text-input').value;
        let selectedOperator = document.getElementById('selected-operator').value;
        if(!text.trim()) return alert('টেক্সট দিন!');

        let lines = text.split('\n');
        let badgeBg = "bg-danger text-white";
        if(selectedOperator === "Banglalink") badgeBg = "bg-warning text-dark";
        if(selectedOperator === "GP") badgeBg = "bg-info text-dark";

        lines.forEach(line => {
            let trimmed = line.trim();
            if(!trimmed) return;
            let convertedLine = bnToEnDigits(trimmed);
            let priceMatch = convertedLine.match(/(\d+)\s*(টাকা|tk|bdt)/i) || convertedLine.match(/—\s*(\d+)/);
            if(!priceMatch) return;

            let price = priceMatch[1];
            let daysMatch = convertedLine.match(/(\d+)\s*(দিন|days)/i) || ["", "৩০ দিন"];
            let validity = daysMatch[0];
            let cleanDetails = trimmed.replace(/^\d+[\.\)]\s*/, '').replace(/—\s*[০-৯\d]+\s*টাকা.*/i, '').trim();

            let newRef = db.ref('offers').push();
            newRef.set({
                op: selectedOperator,
                title: cleanDetails,
                validity: validity,
                price: price,
                badgeBg: badgeBg,
                active: true
            });
        });

        document.getElementById('ai-text-input').value = '';
        alert('অফারগুলো সার্ভারে যুক্ত হয়েছে!');
    }

    function renderAdminTable() {
        const tbody = document.getElementById('admin-table-body');
        const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
        const selectedOp = document.getElementById('filter-operator').value;

        tbody.innerHTML = '';

        let filtered = localOffersList.filter(item => {
            let matchOp = (selectedOp === "ALL" || item.op === selectedOp);
            let matchSearch = item.title.toLowerCase().includes(searchQuery) || item.price.toString().includes(searchQuery);
            return matchOp && matchSearch;
        });

        if(filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-3">কোনো অফার পাওয়া যায়নি</td></tr>`;
            return;
        }

        filtered.forEach(item => {
            let isActive = item.active !== false;
            tbody.innerHTML += `
                <tr class="${isActive ? '' : 'table-inactive'}">
                    <td><span class="badge ${item.badgeBg}">${item.op}</span></td>
                    <td class="fw-bold">${item.title}</td>
                    <td>${item.validity}</td>
                    <td class="text-success fw-bold">৳ ${item.price}</td>
                    <td>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleOfferStatus('${item.id}', ${!isActive})">
                        </div>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${item.id}')"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteSingleOffer('${item.id}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
        });
    }

    function toggleOfferStatus(id, newStatus) {
        db.ref('offers/' + id).update({ active: newStatus });
    }

    function toggleOperatorStatus(status) {
        let selectedOp = document.getElementById('filter-operator').value;
        if(selectedOp === "ALL") return alert('নির্দিষ্ট অপারেটর ফিল্টার করুন!');
        localOffersList.forEach(o => {
            if(o.op === selectedOp) db.ref('offers/' + o.id).update({ active: status });
        });
    }

    function openEditModal(id) {
        let item = localOffersList.find(o => o.id === id);
        if(!item) return;
        document.getElementById('edit-offer-id').value = item.id;
        document.getElementById('edit-offer-op').value = item.op;
        document.getElementById('edit-offer-title').value = item.title;
        document.getElementById('edit-offer-validity').value = item.validity;
        document.getElementById('edit-offer-price').value = item.price;
        editModal = new bootstrap.Modal(document.getElementById('editOfferModal'));
        editModal.show();
    }

    function saveEditedOffer() {
        let id = document.getElementById('edit-offer-id').value;
        let op = document.getElementById('edit-offer-op').value;
        let badgeBg = "bg-danger text-white";
        if(op === "Banglalink") badgeBg = "bg-warning text-dark";
        if(op === "GP") badgeBg = "bg-info text-dark";

        db.ref('offers/' + id).update({
            op: op,
            title: document.getElementById('edit-offer-title').value,
            validity: document.getElementById('edit-offer-validity').value,
            price: document.getElementById('edit-offer-price').value,
            badgeBg: badgeBg
        }).then(() => editModal.hide());
    }

    function deleteSingleOffer(id) {
        if(confirm('অফারটি মুছে ফেলতে চান?')) db.ref('offers/' + id).remove();
    }

    function clearFilteredOrAllOffers() {
        let selectedOp = document.getElementById('filter-operator').value;
        if(selectedOp === "ALL") {
            if(confirm('সব মুছে ফেলবেন?')) db.ref('offers').remove();
        } else {
            if(confirm(`সব ${selectedOp} অফার মুছবেন?`)) {
                localOffersList.forEach(o => {
                    if(o.op === selectedOp) db.ref('offers/' + o.id).remove();
                });
            }
        }
    }
</script>
</body>
                                                                                        </html>
